# ═══════════════════════════════════════════════════════════════════════
# EXAMPLE — DO NOT USE AS-IS
# Copy to docker-compose.prod.yml and fill in your own values for
# Oidc__Authority, Oidc__ClientId, Oidc__ClientSecret, and
# Login__ReturnUrl. See docs/prod-oidc-setup.md.
# ═══════════════════════════════════════════════════════════════════════

services:
  lustre-todos:
    image: ghcr.io/anthonydickson/lustre-todos:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      Login__ReturnUrl: "http://localhost:5173/"
      Oidc__Authority: "https://127.0.0.1:9091"
      Oidc__ClientId: "lustre-todos"
      Oidc__ClientSecret: "elmish-todos-dev-secret"
      Oidc__CallbackPath: "/signin-oidc"
      # Oidc__LogoutUrl: "https://auth.example.com/logout?rd=https://app.example.com/signed-out"
      ConnectionStrings__Default: "Data Source=/data/app.sqlite3"
      Logging__FilePath: "/logs/app.log"
      DataProtection__KeysPath: "/data/keys"
    volumes:
      - todos-data:/data
      - logs-data:/logs
    healthcheck:
      # BusyBox wget; 127.0.0.1 because Kestrel listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  todos-data:
  logs-data:
